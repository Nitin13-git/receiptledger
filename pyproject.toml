[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "receiptledger"
version = "0.1.0"
description = "Append-only receipt ledger for agent sessions — O(1) head lookup per key and optimistic-concurrency conflict detection."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [{ name = "Nitin Kushwaha" }]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.hatch.build.targets.wheel]
packages = ["src/receiptledger"]

[tool.pytest.ini_options]
pythonpath = ["src"]
